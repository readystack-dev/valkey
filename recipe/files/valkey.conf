# ReadyStack Valkey 9.2.0 single-container CE config.
# Derived from the upstream valkey.conf defaults, adapted for a containerized,
# non-root, foreground (PID 1) deployment. Protected mode is on and there is no TLS: set VALKEY_PASSWORD
# for remote clients, and enable `tls-port` + certs or run behind a trusted network.
bind * -::*
# Upstream's default: with no password set, only clients on the loopback interface (inside this container)
# may connect. Set VALKEY_PASSWORD (see the entrypoint) to accept authenticated clients from other hosts.
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
supervised no
loglevel notice
logfile ""
databases 16
dir /data
save 3600 1 300 100 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
appendonly no
maxmemory-policy noeviction
